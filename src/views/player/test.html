<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>abc2svg 渲染 + 播放（官方文档修正版）</title>
  <script src="https://moinejf.pages-perso.free.fr/js/abc2svg-1.js"></script>
  <!-- 关键：使用 play-1.js，而非 snd-1.js -->
  <script src="https://moinejf.pages-perso.free.fr/js/play-1.js"></script>
  <script src="https://moinejf.pages-perso.free.fr/js/jianpu-1.js"></script>
  <style>
      body { font-family: sans-serif; margin: 20px; background: #f7f9fa; }
      .score-box {
          background: #fff; border: 2px solid #ddd; border-radius: 8px;
          padding: 15px; margin: 10px 0; cursor: pointer;
          transition: border-color 0.2s;
      }
      .score-box:hover { border-color: #3498db; }
      .score-box.playing { border-color: #e74c3c; }
      svg { display: block; margin: 0 auto; max-width: 100%; }
      .status { color: #888; font-size: 0.9em; margin-top: 8px; }
  </style>
</head>
<body>

<h2>🎵 五线谱（点击播放）</h2>
<div id="score1" class="score-box"></div>
<div id="status1" class="status">点击乐谱播放</div>

<h2>🎵 简谱（点击播放）</h2>
<div id="score2" class="score-box"></div>
<div id="status2" class="status">点击乐谱播放</div>

<script>
  window.addEventListener('load', function() {
    if (typeof abc2svg === 'undefined' || typeof AbcPlay === 'undefined') {
      document.getElementById('status1').textContent = '依赖未加载，请检查网络';
      return;
    }

    var abcStaff = 'X:1\nT:小星星\nM:4/4\nL:1/4\nK:C\nC C G G | A A G2 | F F E E | D D C2 |';
    var abcJianpu = 'X:1\nT:小星星\nM:4/4\nL:1/4\nK:C\n%%jianpu 1\nC C G G | A A G2 | F F E E | D D C2 |';

    // ---- 1. 创建播放器实例（工厂函数，不使用 new）----
    var abcplay = AbcPlay({
      onend: function() {
        document.querySelectorAll('.score-box').forEach(function(b) {
          b.classList.remove('playing');
        });
        document.getElementById('status1').textContent = '播放结束';
        document.getElementById('status2').textContent = '播放结束';
      }
    });

    // 确认 clear 方法存在
    if (typeof abcplay.clear !== 'function') {
      document.getElementById('status1').textContent = '播放器初始化失败：clear 方法不存在';
      return;
    }

    // ---- 2. 渲染可视化乐谱 ----
    function renderScore(containerId, abcText) {
      var container = document.getElementById(containerId);
      container.innerHTML = '';
      var abc = new abc2svg.Abc({
        img_out: function(svg) {
          container.innerHTML += svg;
        }
      });
      abc.tosvg('tune', abcText);
    }

    renderScore('score1', abcStaff);
    renderScore('score2', abcJianpu);

    // ---- 3. 为每个乐谱生成播放事件队列 ----
    var playEvents = {};

    function preparePlayEvents(key, abcText) {
      var tmp = document.createElement('div');
      tmp.style.display = 'none';
      document.body.appendChild(tmp);

      var abc = new abc2svg.Abc({
        img_out: function(svg) { tmp.innerHTML += svg; }
      });

      // 关键：先渲染 %%play 生成音频事件，再渲染乐谱内容
      abc.tosvg('play', '%%play');
      abc.tosvg('tune', abcText);

      // 获取事件队列（官方文档方式）
      playEvents[key] = abcplay.clear();
    }

    preparePlayEvents('staff', abcStaff);
    preparePlayEvents('jianpu', abcJianpu);

    // ---- 4. 绑定点击播放 ----
    var currentPlaying = null;

    function bindPlay(scoreId, statusId, key) {
      var box = document.getElementById(scoreId);
      var status = document.getElementById(statusId);

      box.addEventListener('click', function() {
        if (currentPlaying) {
          abcplay.stop();
          currentPlaying.box.classList.remove('playing');
          currentPlaying.status.textContent = '已停止';
          if (currentPlaying.box === box) { currentPlaying = null; return; }
        }

        var events = playEvents[key];
        if (!events || events.length === 0) {
          status.textContent = '播放事件为空';
          return;
        }

        abcplay.play(0, 1000000, events);
        box.classList.add('playing');
        status.textContent = '播放中...';
        currentPlaying = { box: box, status: status };
      });
    }

    bindPlay('score1', 'status1', 'staff');
    bindPlay('score2', 'status2', 'jianpu');
  });
</script>

</body>
</html>
