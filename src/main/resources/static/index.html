<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC谱播放器 - 在线音乐编辑与播放</title>
  <!--<link rel="stylesheet" href="css/abcjs-audio.css">-->
  <link rel="stylesheet" href="css/audio.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="container">
  <div class="header-bar">
    <h1>🎵 ABC谱播放器</h1>
    <div class="user-info">
      <span id="currentUser">欢迎，用户</span>
      <button onclick="showChangePasswordModal()" class="change-password-btn">修改用户信息</button>
      <button onclick="handleLogout()" class="logout-btn">退出登录</button>
    </div>
  </div>

  <!-- 功能导航 -->
  <nav class="top-nav">
    <div class="nav-brand">其他功能：</div>
    <div class="nav-tabs">
      <a href="fqConvertAbc.html" class="nav-tab">
        <span class="nav-icon">🍅</span>
        <span class="nav-text">番茄简谱转ABC</span>
      </a>
      <a href="#" class="nav-tab">
        <span class="nav-icon">🕳️</span>
        <span class="nav-text">ABC转洞洞谱(开发中)</span>
      </a>
    </div>
  </nav>

  <div class="main-content">
    <!-- 编辑器面板 -->
    <div class="panel editor-panel">
      <h2>📝 ABC乐谱编辑器</h2>
      <label for="abcInput" style="display: none;">ABC乐谱输入框</label>
      <textarea id="abcInput" placeholder="在这里输入ABC格式的乐谱...">X:1
T:小星星
M:4/4
L:1/4
K:C
C C G G | A A G2 | F F E E | D D C2 |]</textarea>
      <div class="btn-group">
        <button onclick="renderScore()">🎼 渲染乐谱</button>
        <button class="secondary" onclick="clearEditor()">🗑️ 清空</button>
        <button onclick="enableAudio()">🔊 启用音频</button>
        <span id="total-duration" class="duration-badge" style="display: none;">
          <span class="duration-icon">⏱️</span>
          <span class="duration-text">0:00</span>
        </span>
      </div>
      <div id="status"></div>
    </div>

    <!-- 乐谱显示面板 -->
    <div class="panel score-panel">
      <h2>🎼 五线谱预览</h2>
      <div id="audio-controls" class="audio-controls"></div>
      <div id="score-container" class="score-container"></div>
    </div>
  </div>

  <!-- 示例曲谱 -->
  <div class="panel examples">
    <h3>🎵 快速体验示例</h3>
    <div class="example-buttons">
      <button class="example-btn" onclick="loadExample('twinkle')">⭐ 小星星</button>
      <button class="example-btn" onclick="loadExample('ode')">🎉 欢乐颂</button>
      <button class="example-btn" onclick="loadExample('scale')">🎹 C大调音阶</button>
    </div>
  </div>

  <div class="bottom-panel panel">
    <h3>相关说明</h3>
    <ol>
      <li>交流群：128108872</li>
    </ol>
  </div>
</div>

<!-- 修改用户信息模态框 -->
<div id="changeUserInfoModal" class="modal" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🔐 修改用户信息</h3>
      <span class="close-btn" onclick="closeChangeUserInfoModal()">&times;</span>
    </div>
    <div class="modal-body">
      <form id="changeUserInfoForm">
        <div class="form-group">
          <label for="oldPassword">昵称：</label>
          <input type="text" id="nickname" name="nickname" placeholder="请输入昵称">
        </div>
        <div class="form-group">
          <label for="oldPassword">旧密码：</label>
          <input type="password" id="oldPassword" name="oldPassword" placeholder="请输入旧密码">
        </div>
        <div class="form-group">
          <label for="newPassword">新密码：</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="请输入新密码">
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认新密码：</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入新密码">
        </div>
        <div id="passwordMessage" class="message"></div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">确认修改</button>
          <button type="button" class="btn-secondary" onclick="closeChangeUserInfoModal()">取消</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/http.js"></script>
<script src="js/auth.js"></script>
<script src="js/abcjs-basic.js"></script>
<script src="js/index.js"></script>
</body>
</html>
