spring:
  application:
    name: abc-player
  profiles:
    active: dev


# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描路径
  type-aliases-package: com.biluo.player.entity
  
  # 全局配置
  global-config:
    db-config:
      # 主键类型（AUTO 自增）
      id-type: AUTO
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    # 关闭 banner
    banner: false
  
  # 配置
  configuration:
    # 驼峰命名转换
    map-underscore-to-camel-case: true
    # 打印 SQL 日志（开发环境）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 缓存
    cache-enabled: false

# 日志配置
logging:
  level:
    com.biluo.player.mapper: debug
    com.biluo.player.service: info