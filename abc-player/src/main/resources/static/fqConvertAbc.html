<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄简谱转ABC谱</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="container">
  <div class="header-bar">
    <h1>🍅 番茄简谱转ABC谱</h1>
    <div class="user-info">
      <span id="currentUser">欢迎，用户</span>
      <button onclick="handleLogout()" class="logout-btn">退出登录</button>
    </div>
  </div>

  <!-- 功能导航 -->
  <nav class="top-nav">
    <div class="nav-brand">其他功能：</div>
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab">
        <span class="nav-icon">🎵</span>
        <span class="nav-text">ABC谱播放器</span>
      </a>
      <a href="#" class="nav-tab">
        <span class="nav-icon">🕳️</span>
        <span class="nav-text">ABC转洞洞谱(开发中)</span>
      </a>
    </div>
  </nav>

  <div class="main-content">
    <!-- 编辑器面板 -->
    <div class="panel editor-panel">
      <h2>番茄简谱转ABC谱</h2>
      <label for="fqInput" style="display: none;">番茄简谱输入框</label>
      <textarea id="fqInput" placeholder="在这里输入番茄简谱格式的乐谱..."></textarea>
      <div class="btn-group">
        <button onclick="renderScore()">🎼 渲染乐谱</button>
        <button class="secondary" onclick="clearEditor()">🗑️ 清空</button>
      </div>
      <div id="status"></div>
    </div>

    <!-- 乐谱显示面板 -->
    <div class="panel score-panel">
      <h2>🎼 ABC谱预览</h2>
      <div id="score-container" class="score-container"></div>
    </div>
  </div>

</div>

<script src="js/http.js"></script>
<script src="js/auth.js"></script>
<script src="js/fqConvertAbc.js"></script>
</body>
</html>
